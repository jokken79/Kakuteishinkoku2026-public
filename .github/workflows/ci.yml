name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela corridas viejas del mismo ref al pushear de nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Fuente CJK TrueType: habilita los tests de extracción de 過去の申告
      # (sin ella se saltan; con ella corren de verdad).
      - name: Instalar fuente japonesa (IPAex Gothic)
        run: sudo apt-get update && sudo apt-get install -y fonts-ipaexfont-gothic

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Mypy (strict)
        run: mypy app

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test:run

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Build (vite)
        run: npm run build
