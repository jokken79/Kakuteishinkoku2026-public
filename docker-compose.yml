# docker-compose — 確定申告 2026
# Puertos locales: backend 8200 y frontend 5200; PostgreSQL solo en la red interna.
# Docker NO es requerido para desarrollo nativo; ver READMEs de backend/ y frontend/.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kakutei
      POSTGRES_PASSWORD: kakutei
      POSTGRES_DB: kakuteishinkoku
    volumes:
      - kakutei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakutei -d kakuteishinkoku"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://kakutei:kakutei@postgres:5432/kakuteishinkoku
    volumes:
      - kakutei_appdata:/app/data
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5200:5200"
    depends_on:
      - backend

volumes:
  kakutei_pgdata:
  kakutei_appdata:
